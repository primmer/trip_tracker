commands:
  install: npm install
  typecheck: npm run typecheck
  build: npx vite build
  test: npx vitest run
  lint: npm run lint
  dev: ./dev.sh

services:
  vite:
    start: npx vite --port 5173
    stop: lsof -ti :5173 | xargs kill
    healthcheck: curl -sf http://localhost:5173
    port: 5173
    depends_on: []

  functions:
    start: cd functions && npm run build && npx firebase emulators:start --only functions
    stop: lsof -ti :5001 | xargs kill
    healthcheck: curl -sf http://localhost:5001
    port: 5001
    depends_on: []
